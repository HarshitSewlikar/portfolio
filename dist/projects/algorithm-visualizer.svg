<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Algorithm Visualizer with AI Chatbot — project preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f1d05"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Decorative dots -->
  <g fill="#eab308" fill-opacity="0.2">
    <circle cx="110" cy="80" r="8"/>
    <circle cx="160" cy="120" r="5"/>
    <circle cx="200" cy="70" r="4"/>
    <circle cx="640" cy="360" r="9"/>
    <circle cx="700" cy="100" r="6"/>
  </g>
  <!-- Algorithm bars -->
  <g>
    <rect x="100" y="320" width="28" height="40" rx="4" fill="#eab308"/>
    <rect x="138" y="280" width="28" height="80" rx="4" fill="#fde68a"/>
    <rect x="176" y="240" width="28" height="120" rx="4" fill="#f97316"/>
    <rect x="214" y="300" width="28" height="60" rx="4" fill="#eab308"/>
    <rect x="252" y="220" width="28" height="140" rx="4" fill="#fde68a"/>
  </g>
  <!-- Chat bubble -->
  <g transform="translate(540 230)">
    <rect width="180" height="100" rx="14" fill="#22c55e" fill-opacity="0.18" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="22" cy="28" r="6" fill="#86efac"/>
    <rect x="38" y="22" width="120" height="8" rx="4" fill="#86efac" fill-opacity="0.7"/>
    <rect x="22" y="46" width="138" height="6" rx="3" fill="#86efac" fill-opacity="0.45"/>
    <rect x="22" y="60" width="100" height="6" rx="3" fill="#86efac" fill-opacity="0.45"/>
    <rect x="22" y="74" width="80" height="6" rx="3" fill="#86efac" fill-opacity="0.45"/>
  </g>
  <text x="50%" y="46%" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="800">Algorithm Visualizer</text>
  <text x="50%" y="56%" text-anchor="middle" fill="#fde68a" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="800">+ AI Chatbot</text>
  <text x="50%" y="68%" text-anchor="middle" fill="#fed7aa" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="2">REACT · PYTHON · SQL · LLM</text>
</svg>
